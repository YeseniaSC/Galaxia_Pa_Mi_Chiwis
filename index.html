<select value="@filterProyecto2" @onchange="OnProyecto2Changed">
    <option value="">Todos</option>
    @foreach (var p in proyectos
        .Union(string.IsNullOrEmpty(filterProyecto2) ? Array.Empty<string>() : new[]{filterProyecto2})
        .Distinct().OrderBy(x => x))
    {
        <option value="@p">@p</option>
    }
</select>
